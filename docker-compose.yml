services:
  db:
    image: postgis/postgis:16-3.4
    container_name: booking_db
    restart: always
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: postgres -c max_connections=1000

  backend:
    build:
      context: ./backend
    container_name: booking_backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - django_media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: booking_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  locust:
    image: locustio/locust
    container_name: booking_locust
    working_dir: /mnt/locust
    volumes:
      - ./:/mnt/locust
    ports:
      - "8089:8089"
    depends_on:
      - backend
    command: -f /mnt/locust/locustfile.py --host http://backend:8000

volumes:
  postgres_data:
  django_media:
